<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-canvas { fill: url(#bgGrad); }
    .network-node { fill: #38bdf8; opacity: 0.6; }
    .network-line { stroke: #4f46e5; stroke-width: 1.5; opacity: 0.25; stroke-dasharray: 4,4; }
    
    /* Animation Keyframes */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beacon {
      0%, 100% { r: 5; opacity: 0.8; }
      50% { r: 12; opacity: 0.2; }
    }

    .pulse-glow-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-glow-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 250px;
    }
    .floating-card-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dataStream 4s linear infinite;
    }
    .beacon-pulse {
      animation: beacon 3s ease-in-out infinite;
    }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" class="bg-canvas" />

  <!-- Animated Ambient Nebula Lights in Background -->
  <g class="pulse-glow-1">
    <circle cx="220" cy="110" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.25" />
    <circle cx="160" cy="160" r="100" fill="#a855f7" filter="url(#glow)" opacity="0.2" />
  </g>
  <g class="pulse-glow-2">
    <circle cx="980" cy="220" r="160" fill="#06b6d4" filter="url(#glow)" opacity="0.2" />
    <circle cx="1040" cy="180" r="110" fill="#8b5cf6" filter="url(#glow)" opacity="0.22" />
  </g>

  <!-- Network Mesh Visualization (Background Dynamics) -->
  <g opacity="0.45">
    <line x1="80" y1="60" x2="220" y2="130" class="network-line" />
    <line x1="220" y1="130" x2="350" y2="70" class="network-line" />
    <line x1="350" y1="70" x2="480" y2="120" class="network-line stream-line" stroke="#60a5fa" />
    <line x1="220" y1="130" x2="180" y2="280" class="network-line" />
    <line x1="780" y1="60" x2="900" y2="130" class="network-line stream-line" stroke="#a78bfa" />
    <line x1="900" y1="130" x2="1060" y2="80" class="network-line" />
    <line x1="900" y1="130" x2="960" y2="270" class="network-line" />
    <line x1="960" y1="270" x2="1120" y2="240" class="network-line" />
    <line x1="1060" y1="80" x2="1140" y2="170" class="network-line" />
    
    <circle cx="80" cy="60" r="4" class="network-node" />
    <circle cx="220" cy="130" r="6" fill="#818cf8" />
    <circle cx="350" cy="70" r="5" class="network-node" />
    <circle cx="480" cy="120" r="4" fill="#a855f7" />
    <circle cx="180" cy="280" r="5" class="network-node" />
    <circle cx="780" cy="60" r="4" class="network-node" />
    <circle cx="900" cy="130" r="6" fill="#38bdf8" />
    <circle cx="1060" cy="80" r="5" fill="#c084fc" />
    <circle cx="960" cy="270" r="7" fill="#6366f1" />
    <circle cx="1120" cy="240" r="4" class="network-node" />
    <circle cx="1140" cy="170" r="5" class="network-node" />

    <!-- Pulsing Signal Ring -->
    <circle cx="960" cy="270" r="14" fill="none" stroke="#6366f1" stroke-width="1.5" class="beacon-pulse" />
    <circle cx="220" cy="130" r="12" fill="none" stroke="#a855f7" stroke-width="1.5" class="beacon-pulse" />
  </g>

  <!-- Side Floating Aesthetic Cards (Behind main text content) -->
  <g class="floating-card-1" opacity="0.75">
    <rect x="75" y="195" width="180" height="75" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <circle cx="102" cy="225" r="14" fill="#3b82f6" fill-opacity="0.25" />
    <path d="M96 225 L108 225 M102 219 L102 231" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
    <text x="126" y="222" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Fediverse Hub</text>
    <text x="126" y="240" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">ActivityPub &amp; Matrix</text>
  </g>

  <g class="floating-card-2" opacity="0.75">
    <rect x="945" y="90" width="185" height="75" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <circle cx="972" cy="120" r="14" fill="#10b981" fill-opacity="0.2" />
    <circle cx="972" cy="120" r="5" fill="#10b981" />
    <text x="996" y="117" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Directory Mesh</text>
    <text x="996" y="135" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">50k+ Stars Verified</text>
  </g>

  <!-- Center Foreground Content Layer -->
  <!-- Tag Pill -->
  <g transform="translate(435, 52)">
    <rect width="330" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4" fill="#22c55e" />
    <text x="32" y="19" class="badge-pill-text">Curated Community Directories &amp; Social OS</text>
  </g>

  <!-- Foreground Primary Title -->
  <g transform="translate(600, 140)">
    <text text-anchor="middle" class="title-text">
      Awesome Social Networking &amp; Communities
    </text>
  </g>

  <!-- Foreground Subtitle & Tagline -->
  <g transform="translate(600, 185)">
    <text text-anchor="middle" class="subtitle-text">
      The definitive directory of community portals, federated social networks, member indices &amp; self-hosted hubs
    </text>
  </g>

  <!-- Category Mini Badges -->
  <g transform="translate(305, 226)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="62" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🌐 Fediverse</text>
    
    <!-- Pill 2 -->
    <rect x="137" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="209" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">👥 Member Directories</text>

    <!-- Pill 3 -->
    <rect x="294" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="364" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">💬 Forum Software</text>

    <!-- Pill 4 -->
    <rect x="446" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="518" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">⚡ SaaS Communities</text>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(600, 310)">
    <text text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      SaaS Pricing Models • Open-Source Repositories • Star Counts • Federated Protocols
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="250" y="340" width="700" height="3" rx="1.5" fill="url(#primaryGrad)" />
</svg>
